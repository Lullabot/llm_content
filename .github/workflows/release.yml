name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          # Get previous release tag (matching v*), excluding the current tag.
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -v "^${{ github.ref_name }}$" | head -1)
          NOTES_FILE="release-notes.md"
          if [ -z "$PREV_TAG" ]; then
            echo "Initial release." > "$NOTES_FILE"
          else
            NOTES=$(git log --oneline --no-merges "${PREV_TAG}..HEAD" | sed 's/^/- /')
            {
              echo "## Changes since ${PREV_TAG}"
              echo ""
              echo "$NOTES"
            } > "$NOTES_FILE"
          fi

      - name: Create GitHub release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file "release-notes.md" \
            --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
